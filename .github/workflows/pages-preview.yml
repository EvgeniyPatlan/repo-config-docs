# Fork-only: publishes this branch's build to GitHub Pages so the llms.txt
# work can be checked on a real host. Not meant for percona/repo-config-docs.
name: Pages preview

on:
  push:
    branches: [pages-preview]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MkDocs and plugins (requirements.txt, as the docs deploy does)
        run: python -m pip install -r requirements.txt
      - name: Build
        env:
          CI: "false" # keeps git-committers off: it calls the GitHub API for every page
          ENABLED_GIT_REVISION_DATE: "false" # needs the full history; the checkout is shallow
          NO_MKDOCS_2_WARNING: "1"
        run: |
          mkdocs build --site-dir site
          test -s site/llms.txt
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the Pages site
      id-token: write # prove the deployment's origin to Pages (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
